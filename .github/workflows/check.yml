name: Check plugin
on:
  push:
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
concurrency:
  group: dowse-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Package install
        if: runner.os == 'Linux'
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: release-candidate
          path: |
            build/dowse-obsidian-*.zip
            build/SHA256SUMS
            build/release.json
      - uses: actions/upload-artifact@v4
        with:
          name: dowse-${{ runner.os }}
          path: |
            main.js
            styles.css
            manifest.json
            README.md
            LICENSE
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Installed Obsidian on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64
          curl -fL https://github.com/obsidianmd/obsidian-releases/releases/download/v1.15.0/obsidian-1.15.0.tar.gz -o "$RUNNER_TEMP/obsidian.tar.gz"
          mkdir "$RUNNER_TEMP/obsidian"
          tar -xzf "$RUNNER_TEMP/obsidian.tar.gz" -C "$RUNNER_TEMP/obsidian" --strip-components=1
          echo "OBSIDIAN_EXECUTABLE=$RUNNER_TEMP/obsidian/obsidian" >> "$GITHUB_ENV"
      - name: Installed Obsidian on Mac
        if: runner.os == 'macOS'
        run: |
          curl -fL https://github.com/obsidianmd/obsidian-releases/releases/download/v1.15.0/Obsidian-1.15.0.dmg -o "$RUNNER_TEMP/Obsidian.dmg"
          hdiutil attach "$RUNNER_TEMP/Obsidian.dmg" -mountpoint "$RUNNER_TEMP/dowse-obsidian-mount"
          cp -R "$RUNNER_TEMP/dowse-obsidian-mount/Obsidian.app" "$RUNNER_TEMP/Obsidian.app"
          hdiutil detach "$RUNNER_TEMP/dowse-obsidian-mount"
          echo "OBSIDIAN_EXECUTABLE=$RUNNER_TEMP/Obsidian.app/Contents/MacOS/Obsidian" >> "$GITHUB_ENV"
      - name: Native smoke
        shell: bash
        env:
          DOWSE_STRESS_FILES: '5000'
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a npm run smoke
          else
            npm run smoke
          fi
      - name: Real CPU inference
        shell: bash
        env:
          DOWSE_STRESS_FILES: '5000'
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a npm run test:native-model
          else
            npm run test:native-model
          fi
      - name: Larger vault reliability
        shell: bash
        env:
          DOWSE_STRESS_FILES: '5000'
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a npm run test:vault
          else
            npm run test:vault
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ runner.os }}
          path: |
            .cache/smoke
            .cache/release-validation/model-*
            .cache/release-validation/stress-*
