name: Check plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: xz for bundled runtime
        if: runner.os == 'Windows'
        run: choco install xz --no-progress -y
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dowse-${{ runner.os }}
          path: |
            main.js
            styles.css
            manifest.json
            README.md
  native:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Installed Obsidian on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64
          curl -fL https://github.com/obsidianmd/obsidian-releases/releases/download/v1.15.0/obsidian-1.15.0.tar.gz -o "$RUNNER_TEMP/obsidian.tar.gz"
          mkdir "$RUNNER_TEMP/obsidian"
          tar -xzf "$RUNNER_TEMP/obsidian.tar.gz" -C "$RUNNER_TEMP/obsidian" --strip-components=1
          echo "OBSIDIAN_EXECUTABLE=$RUNNER_TEMP/obsidian/obsidian" >> "$GITHUB_ENV"
      - name: Installed Obsidian on Mac
        if: runner.os == 'macOS'
        run: |
          curl -fL https://github.com/obsidianmd/obsidian-releases/releases/download/v1.15.0/Obsidian-1.15.0.dmg -o "$RUNNER_TEMP/Obsidian.dmg"
          hdiutil attach "$RUNNER_TEMP/Obsidian.dmg" -mountpoint "$RUNNER_TEMP/dowse-obsidian-mount"
          cp -R "$RUNNER_TEMP/dowse-obsidian-mount/Obsidian.app" "$RUNNER_TEMP/Obsidian.app"
          hdiutil detach "$RUNNER_TEMP/dowse-obsidian-mount"
          echo "OBSIDIAN_EXECUTABLE=$RUNNER_TEMP/Obsidian.app/Contents/MacOS/Obsidian" >> "$GITHUB_ENV"
      - name: Native integration, real CPU inference and larger vault
        shell: bash
        env:
          DOWSE_STRESS_FILES: '5000'
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a npm run smoke
            xvfb-run -a npm run test:native-model
            xvfb-run -a npm run test:vault
          else
            npm run smoke
            npm run test:native-model
            npm run test:vault
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ runner.os }}
          path: |
            .cache/smoke
            .cache/release-validation/model-*
            .cache/release-validation/stress-*
